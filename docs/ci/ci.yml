# Copy to .github/workflows/ci.yml  (kept under docs/ci/ because some tools refuse to write into .github/)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Unit + integration tests (scripted model, no API key needed)
        run: python -m pytest -q
      - name: Offline end-to-end demo
        run: python -m threadroute demo
      - name: Evaluation - evaluator self-test + runtime guard drill (offline)
        run: python -m threadroute evaluate --offline --out evidence
      - name: Speed / token benchmark (offline)
        run: python -m threadroute benchmark --out evidence
      - name: Release gate (secrets, personal data, risky constructs)
        run: python scripts/release_check.py
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-evidence-${{ matrix.os }}-${{ matrix.python }}
          path: evidence/

  live-evaluation:
    # Optional: runs the live golden set when a GOOGLE_API_KEY repository secret exists. Never runs on forks.
    if: github.event_name == 'push' && github.repository_owner == github.actor
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Live golden set
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then echo "No GOOGLE_API_KEY secret - skipping live evaluation"; exit 0; fi
          python -m threadroute evaluate --live --out evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: live-evaluation, path: evidence/, if-no-files-found: ignore }
