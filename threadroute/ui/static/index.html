<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ThreadRoute - Logistics Control Tower</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <h1>ThreadRoute</h1><span class="sub">Logistics control tower - Aurelio Menswear</span>
  <div class="pills" id="pills"></div>
</header>
<main>
  <section class="card" id="chat">
    <div id="log"></div>
    <div class="chips" id="chips"></div>
    <div id="attached"></div>
    <form id="composer">
      <input type="file" id="file" accept="image/png,image/jpeg,image/webp" hidden>
      <button type="button" id="attach" title="Attach a photo">Attach photo</button>
      <textarea id="text" placeholder="Ask about a shipment, a stock-out, a return... or attach a photo"></textarea>
      <button class="primary" id="send" type="submit">Send</button>
    </form>
  </section>
  <section class="card">
    <div class="tabs">
      <button class="tab active" data-tab="approvals">Approvals <span id="badge"></span></button>
      <button class="tab" data-tab="health">Self-healing</button>
      <button class="tab" data-tab="rules">Learned rules</button>
      <button class="tab" data-tab="security">Privacy</button>
      <button class="tab" data-tab="perf">Cost &amp; speed</button>
      <button class="tab" data-tab="report">Report</button>
    </div>
    <div class="panel active" id="p-approvals"></div>
    <div class="panel" id="p-health"></div>
    <div class="panel" id="p-rules"></div>
    <div class="panel" id="p-security"></div>
    <div class="panel" id="p-perf"></div>
    <div class="panel" id="p-report"></div>
  </section>
</main>
<script src="/static/app.js" defer></script>
</body>
</html>
